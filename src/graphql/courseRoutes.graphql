query courseRoutes($first: Int!, $after: String) {
	courses: courses(
		where: {orderby: {field: MODIFIED, order: DESC}}
		first: $first
		after: $after
	) {
		nodes {
			slug
			modified
			chapters {
				chapters(first: 100) {
					nodes {
						__typename
						... on Chapter {
							slug
							modified
						}
					}
				}
			}
		}
	}
}
