query courseSidebar($slug: ID!) {
	course: course(id: $slug, idType: SLUG) {
		title
		slug
		emogi {
			emogi
		}
		chapters {
			chapters(first: 100) {
				nodes {
					__typename
					... on Chapter {
						title
						slug
						readTime
						section {
							section
						}
						emogi {
							emogi
						}
					}
				}
			}
		}
	}
}
